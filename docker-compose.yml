services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233"]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address localhost:7233 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: .
    command: ["node", "dist/server.js"]
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-queue
      SUPPLIER_A_URL: http://api:3000
      SUPPLIER_B_URL: http://api:3000
      SUPPLIER_A_ENABLED: ${SUPPLIER_A_ENABLED:-true}
      SUPPLIER_B_ENABLED: ${SUPPLIER_B_ENABLED:-true}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-queue
      SUPPLIER_A_URL: http://api:3000
      SUPPLIER_B_URL: http://api:3000
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  redis-data:
